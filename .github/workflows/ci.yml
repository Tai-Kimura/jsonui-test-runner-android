name: CI

# JVM units on every push/PR, plus the 20 on-device tests (src/androidTest)
# on a headless emulator. Public repo: standard hosted runners only, which
# are free here. Do not move these jobs to larger runners.
#
# Both jobs are judged from the JUnit XML (.github/scripts/junit_gate.py),
# not from Gradle's exit alone: 0 executed cases is red ("green because
# nothing ran"), as is any failure or error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to the same PR supersedes the older run; pushes to main
  # each keep their own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile release + run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :jsonuitestrunner:compileReleaseKotlin :jsonuitestrunner:testDebugUnitTest
      - name: Judge the unit tests from their XML
        if: always()
        run: python3 .github/scripts/junit_gate.py jvm jsonuitestrunner/build/test-results/testDebugUnitTest
      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          if-no-files-found: warn
          path: |
            jsonuitestrunner/build/test-results/testDebugUnitTest/
            jsonuitestrunner/build/reports/tests/testDebugUnitTest/

  on-device:
    runs-on: ubuntu-latest
    # Budget, from run 39047136816 (2026-10-17, good runner): emulator step
    # 9.0 min = boot to adb ~1.5 + Gradle 7.6 (build ~3.2 + 20 cases 4.4).
    # Hosted emulators run up to ~3x slower on a degraded runner (jsonui-cli
    # conformance-mobile.yml, android-library-tests budget notes): the
    # build and the cases scale, the boot is capped by emulator-boot-timeout
    # (5). Degraded: 5 + (3.2 + 4.4) x 3 = 27.8 min; step 40 holds that
    # with ~1.4x margin and is ~4.4x the good run (2x margin on the good
    # run alone would be 18, which a degraded runner overruns). Job = step + setup/upload ~2
    # + slack -> 50 (attempt < step < job). A cancelled run here means
    # suspect this number first, and re-measure.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Emulator profile: the same one jsonui-cli's android-library-tests job
      # uses for KotlinJsonUI's device tests — API 35 (on the API 34
      # google_apis CI image the IME never shows and the a11y walk of the
      # active window intermittently comes back empty; measured there in run
      # 36197930038), pixel_tablet (2560x1600, the size of the conf_ci AVD
      # these tests are written against). device-evidence/device.txt records
      # what the run actually got.
      - name: Run on-device tests (emulator)
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash .github/scripts/device_tests.sh
      - name: Judge the on-device tests from their XML
        if: always()
        run: python3 .github/scripts/junit_gate.py on-device jsonuitestrunner/build/outputs/androidTest-results
      - name: Upload on-device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-device-results
          if-no-files-found: warn
          path: |
            jsonuitestrunner/build/outputs/androidTest-results/
            jsonuitestrunner/build/reports/androidTests/
            device-evidence/
